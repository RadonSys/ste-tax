# Tests and one mock run of the eval harness. No model, no torch: the
# hf extra is never installed here.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true # .github/skills carries the asd-ste100 checker
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Tests
        run: uv run --locked pytest
      - name: Mock run with the checker
        run: |
          uv run --locked python -m eval run --backend mock --limit 3 --run-id ci
          uv run --locked python -m eval summarize eval/results/ci
